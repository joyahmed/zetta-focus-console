# Keeps the four checks that pass today passing once other people send
# changes. They are the same four the working plan lists as the bar for
# calling something done, plus the engine tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant. Without
# this they both run to completion and the queue is twice as long as it needs
# to be — except on main, where each commit's result is worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: tsc and vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # `bun run build` is `tsc && vite build`, which is the whole frontend
      # bar in one command.
      - run: bun run build

  rust:
    name: cargo check, fmt and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Cargo's own caching, keyed on the lockfile. The Tauri dependency tree
      # is most of the build time here and it changes rarely.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk is Tauri's webview on Linux. libasound2-dev is what rodio
      # builds against for ALSA — without it the build fails as a Rust error
      # about a missing symbol rather than as an obviously missing package.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      # Formatting first: it needs no dependency tree, so a badly formatted
      # patch fails in seconds rather than after a full check.
      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo check --all-targets
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri
