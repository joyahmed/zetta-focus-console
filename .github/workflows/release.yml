# Build on a tag and attach the installers to a draft release.
#
# Draft, not published: the last step before a release goes out is somebody
# downloading one of these and installing it on a machine that has never had
# the app. Publishing is a button once that is done.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand, so the matrix can be exercised without spending a
  # tag on finding out that a runner image moved.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not cancel the other two — a draft with
      # two of three installers is worth having while the third is fixed.
      fail-fast: false
      matrix:
        include:
          # Windows first, because it is where this is actually used and so the
          # one worth seeing fail first.
          - os: windows-latest
            name: Windows
            args: ''
            rust-targets: ''

          # Apple silicon only. There is deliberately no macos-13 (Intel) job:
          # GitHub is retiring that image, and a job asking for it is no longer
          # scheduled at all — it sits queued with no runner assigned rather
          # than failing, which holds the whole release open, because a draft
          # cannot be published until every platform lands.
          #
          # If Intel is wanted back, `--target universal-apple-darwin` on this
          # runner covers it. That is not the default because it doubles the
          # download for every Mac user to serve the shrinking half, and this
          # is an app that advertises a 4.9 MB installer.
          - os: macos-latest
            name: macOS (Apple silicon)
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'

          - os: ubuntu-latest
            name: Linux
            args: ''
            rust-targets: ''

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Keyed on the platform and the arguments, so the two macOS shapes cannot
      # share a cache. The first build is slow; the rest are not.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os }}-${{ matrix.args }}

      # webkit2gtk is Tauri's renderer on Linux; libasound2-dev is what rodio
      # builds against for ALSA, and without it the failure reads as a Rust
      # error rather than a missing header. The rest of this list is what a
      # Tauri bundle actually needs on a bare runner — libxdo for the global
      # shortcuts, ayatana-appindicator for the tray.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libasound2-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      - run: bun install --frozen-lockfile

      # tauri-action runs the frontend build itself, through the
      # beforeBuildCommand in tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Zetta Focus Console ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Installers are attached below.

            See [CHANGELOG.md](https://github.com/joyahmed/zetta-focus-console/blob/main/CHANGELOG.md)
            for what changed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
